anthropic:
  model: "claude-haiku-4-5"
  max_tokens: 1024

newsapi:
  api_key: ""  # Set via NEWS_API_KEY env var or here
  base_url: "https://newsapi.org/v2"

gnews:
  api_key: ""  # Set via GNEWS_API_KEY env var or here
  base_url: "https://gnews.io/api/v4"

fetcher:
  days_lookback: 7
  dedup_threshold: 85   # fuzzy match score (0-100) above which articles are duplicates
  cache_ttl_hours: 2
  cache_dir: ".cache"
  request_timeout: 10
  max_retries: 3
  retry_base_delay: 1.0

scorer:
  threshold: 30            # articles below this score are filtered out

summarizer:
  max_articles_per_batch: 5
  max_output_tokens: 1024
  max_retries: 3
  retry_base_delay: 1.0

report:
  output_dir: "reports"
  default_format: "markdown"   # markdown | html | json

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
